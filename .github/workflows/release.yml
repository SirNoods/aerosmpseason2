# Save as .github/workflows/release.yml in the repo.
# Push a tag like v1.1.0 (release) or v1.2.0-beta.1 (beta) and this builds the
# CurseForge modpack zip, uploads it to CurseForge and attaches it to a GitHub
# release.
# The release type comes from the tag: no suffix = release, -beta/-rc = beta,
# -alpha = alpha. GitHub marks beta and alpha builds as pre-releases.
# The changelog is built by .github/scripts/changelog.sh, which compares this
# tag with the previous release (mods added/removed/updated, changed config
# files, then commit notes).
#
# The repo root must hold a CurseForge pack export: manifest.json + overrides/.

name: Release modpack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PACK_NAME: AERO SMP TWO
  MC_VERSION: "1.21.1"
  LOADER: neoforge
  # Numeric CurseForge project ID (on the project's overview page in CurseForge for Creators)
  CURSEFORGE_PROJECT_ID: 1738285

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version and release type from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # v1.4.0 -> release, v1.4.0-beta.1 or -rc.1 -> beta, v1.4.0-alpha.1 -> alpha
          case "$VERSION" in
            *-alpha*)       TYPE=alpha ;;
            *-beta*|*-rc*)  TYPE=beta ;;
            *)              TYPE=release ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_TYPE=$TYPE" >> "$GITHUB_ENV"

      - name: Check the repo holds a CurseForge export
        run: |
          if [ ! -f manifest.json ]; then
            echo "manifest.json not found. Commit a CurseForge pack export (manifest.json + overrides/) at the repo root." >&2
            exit 1
          fi
          jq -e '.manifestType == "minecraftModpack" and (.files | length) > 0' manifest.json > /dev/null

      - name: Generate changelog from the previous release
        id: changelog
        run: |
          # Runs before the version is stamped into manifest.json, so it
          # compares the committed files exactly as tagged.
          bash .github/scripts/changelog.sh "$GITHUB_REF_NAME" > changelog.md
          cat changelog.md
          {
            echo "text<<CHANGELOG_EOF"
            cat changelog.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          rm changelog.md

      - name: Stamp version into the manifest
        run: |
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - name: Build modpack zip
        run: |
          FILE="AERO_SMP_TWO-${VERSION}.zip"
          zip -r -X "$FILE" manifest.json overrides \
            $(ls -d modlist.html 2>/dev/null)
          echo "PACK_ZIP=$FILE" >> "$GITHUB_ENV"

      - name: Publish to CurseForge and GitHub
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.PACK_ZIP }}
          name: ${{ env.PACK_NAME }} ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: ${{ env.VERSION_TYPE }}
          loaders: ${{ env.LOADER }}
          game-versions: ${{ env.MC_VERSION }}
          changelog: ${{ steps.changelog.outputs.text }}