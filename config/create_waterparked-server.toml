[water]
	#Friction multiplier inside water-filled slide pipes.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	slideWaterFriction = 0.01
	#Particles sampled per water source anchor for the server water simulation.
	# Default: 20
	# Range: 1 ~ 256
	waterSimParticleCount = 20
	#Maximum particle path length in the server water simulation.
	# Default: 512.0
	# Range: 64.0 ~ 2048.0
	waterSimMaxBlocks = 512.0
	#Minimum ticks between server water simulation recalculations.
	# Default: 20
	# Range: 20 ~ 600
	waterSimCooldownTicks = 20
	#Length of one watered slide sub-segment, in blocks.
	# Default: 0.5
	# Range: 0.25 ~ 4.0
	waterSegmentLength = 0.5
	#Water consumed per second while a slide is watered, in millibuckets.
	# Default: 50.0
	# Range: 0.0 ~ 1000.0
	waterDrainRate = 50.0
	#Water capacity of a slide anchor, in millibuckets.
	# Default: 1000
	# Range: 1 ~ 10000
	anchorFluidCapacity = 1000
	#Pipe wall thickness in blocks. Server authoritative, synced to clients.
	# Default: 0.5
	# Range: 0.1 ~ 0.5
	wallThickness = 0.5

[slide]
	#Maximum total trajectory length for one slide ride, in blocks.
	# Default: 1000.0
	# Range: 50.0 ~ 10000.0
	slideMaxTrajectoryBlocks = 1000.0
	#Cooldown in ticks before a player can start a new slide after cancelling with Shift.
	# Default: 20
	# Range: 0 ~ 200
	slideCancelCooldownTicks = 20
	#Whole Sable sub-levels can ride water slides. Enabled by default on integrated (singleplayer/LAN) servers, disabled by default on dedicated servers for performance - set to true in create_waterparked-server.toml to enable.
	subLevelSlideRiding = true

[accelerator]
	#Stress units per RPM consumed by a slide accelerator.
	# Default: 8.0
	# Range: 0.0 ~ 64.0
	acceleratorStressImpact = 8.0
	#Speed a slide accelerator adds at the reference RPM, in blocks per second.
	# Default: 4.0
	# Range: 0.5 ~ 32.0
	acceleratorBaseSpeed = 4.0
	#RPM at which a slide accelerator adds its base speed; faster rotation scales up linearly.
	# Default: 16.0
	# Range: 1.0 ~ 256.0
	acceleratorReferenceRpm = 16.0

[grab_bar]
	#Distance in blocks in front of a slide grab bar at which an entity takes hold.
	# Default: 1.5
	# Range: 0.5 ~ 8.0
	grabDistance = 1.5
	#Ticks of holding forward needed to fill the grab bar charge and start the slide.
	# Default: 20
	# Range: 5 ~ 200
	grabChargeTicks = 20
