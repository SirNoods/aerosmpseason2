[placementAnimation]
	#Build confirmed routes progressively instead of placing every piece immediately.
	animateRouteConstruction = true
	#Delay in milliseconds between the start of two consecutive pieces.
	#Lower values build the route faster. Range: 50-1000 ms.
	#Speed guide: 50 ms = Very fast, 67 ms = Fast, 100 ms = Normal,
	#200 ms = Slow, 1000 ms = Very slow.
	# Default: 50
	# Range: 50 ~ 1000
	delayTimeMilliseconds = 50
	#Scale each pending piece from minimum to full size before placement.
	#Disable this to keep progressive placement without the zoom effect.
	zoomAnimation = true
	#Keep the complete unbuilt route visible without outlines during construction.
	#Only used while animated route construction is enabled.
	showFullRoutePreview = true
	#Highlight the next piece immediately before it is placed.
	#Only used while animated route construction is enabled.
	showNextPiecePreview = true

[materialSources]
	#Allow the connector to count and consume materials stored inside carried vanilla shulker boxes.
	#Loose inventory items are always used before shulker contents.
	useShulkerMaterials = true

[manualTools]
	#Make manually marked pumps and copper casing positions act as route anchors.
	#Disable this to decorate the current route without changing its path.
	manualMarkersCreateAnchors = true
