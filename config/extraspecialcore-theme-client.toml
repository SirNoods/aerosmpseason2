#============================================================
#PLAYER COLOURS (CLIENT ONLY)
#This machine only — never uploaded to the server.
#Ignored when pack override + lockPlayers is on.
#============================================================
[player]
	#----- START HERE: PERSONAL TINT -----
	#true: apply Border/Text/Accent prefs below. Default: false.
	customEnabled = false
	#When false (Apply to: ESH), colours only tint Extra Special Hub.
	#When true (Apply to: ALL), also tint every ESC window (Dead Air, Pantheon, …).
	#Default: false.
	applyPlayerToAllEsc = false
	#Border swatch index (0–64). Default: 0.
	# Default: 0
	# Range: 0 ~ 64
	borderSwatch = 0
	#Text swatch index (0–64). Default: 0.
	# Default: 0
	# Range: 0 ~ 64
	textSwatch = 0
	#Accent swatch index (0–64). Default: 0.
	# Default: 0
	# Range: 0 ~ 64
	accentSwatch = 0
	#Custom border colour (#RRGGBB / #AARRGGBB). Blank = use borderSwatch.
	borderColor = ""
	#Custom text colour (#RRGGBB / #AARRGGBB). Blank = use textSwatch.
	textColor = ""
	#Custom accent colour (#RRGGBB / #AARRGGBB). Blank = use accentSwatch.
	accentColor = ""
	#Comma-separated recent colours from the ESC colour picker. Default: empty.
	recentColors = ""
	#Comma-separated saved custom colours from the ESC colour picker. Default: empty.
	savedColors = ""

#============================================================
#VISUAL QUALITY AND MOTION (CLIENT ONLY)
#Q / Motion / backdrop / UI scale and sounds on this machine.
#============================================================
[visual]
	#----- START HERE: QUALITY -----
	#OFF, LOW, MEDIUM, HIGH — visual budget for ESC effects.
	#OFF: none. LOW: light scale. MEDIUM: shadows/glow/CRT/border sweeps.
	#HIGH: also enables the animated backdrop (needs Motion ON).
	#Default: HIGH (so Growth backdrop draws on fresh install).
	quality = "HIGH"
	#true (Motion OFF in hub): freeze backdrop/border animation;
	#backdrop still visible at Q=HIGH. Default: false.
	reducedMotion = false
	#Animated backdrop when Q=HIGH and Motion ON:
	#GRID, SCAN, RAIN, PULSE, SPARKS, MATRIX, OCEAN, CLOUDS,
	#AURORA, EMBER, STARFIELD, LIGHTNING, GROWTH. Default: GROWTH.
	backdropStyle = "GROWTH"
	#ESC UI scale multiplier. Default: 1.0.
	# Default: 1.0
	# Range: 0.75 ~ 1.5
	uiScale = 1.0
	#Play ESC UI sound cues (hub nav, buttons, expand/collapse). Default: true.
	uiSounds = true
	#Master multiplier for ESC UI sounds (0–1). Default: 0.85.
	# Default: 0.85
	# Range: 0.0 ~ 1.0
	uiSoundVolume = 0.85
	#Draw EscScreen content/footer bounds (dev aid). Default: false.
	layoutDebug = false
