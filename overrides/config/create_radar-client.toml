	rwrLockVolume = 100
	#.
	#RWR in-range warning volume
	# Default: 100
	# Range: 0 ~ 100
	rwrInRangeVolume = 100
	#.
	#RWR sweep warning volume
	# Default: 100
	# Range: 0 ~ 100
	rwrSweepVolume = 100
	#.
	#RWR engagement warning volume
	# Default: 100
	# Range: 0 ~ 100
	rwrEngagedVolume = 100
	#.
	#Sonar ping volume
	# Default: 100
	# Range: 0 ~ 100
	sonarPingVolume = 100
	#.
	#Sonar ambient hum volume
	# Default: 100
	# Range: 0 ~ 100
	sonarHumVolume = 100
