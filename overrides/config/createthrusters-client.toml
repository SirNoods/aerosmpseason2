#Client-side visuals and UX
[client]
	#Legacy option; addon goggle tooltip details now follow Create's Sneak detail behavior
	showDetailedGoggleTooltips = false
	#Show the attached inventory preview when looking at a Shipping Manifest while wearing Create goggles
	showShippingManifestGoggleTooltip = true
	#Render the attached inventory contents on placed Shipping Manifests and enable mouse-wheel scrolling while looking at them
	renderShippingManifestContents = true
	#Show gyro/link status messages in chat when interacting with blocks
	showLinkStatusChat = true
	#Enable Mannequin Poser GUI
	enableMannequinPoserGui = true
	#Use the StrawStatues/Statue Menus armor stand GUI for armor stands and player mannequins when StrawStatues is installed. StrawStatues entities always keep their own GUI.
	preferStrawStatuesPoserGui = true
	#Maximum local volume multiplier for thruster sounds (0 disables local thruster audio)
	# Default: 1.0
	# Range: 0.0 ~ 2.0
	thrusterMaxVolume = 1.0
	#Local thruster particle multiplier (0 disables local thruster particles)
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	thrusterParticleScale = 1.0
	#Claw marker render mode is disabled; OFF is enforced
	#Allowed Values: DEPTH, DECAL, PARTICLE, OFF
	clawMarkerRenderMode = "OFF"
	#Target frames per second for each visible ACC Display or CCTV tablet camera feed. Actual FPS is limited by your computer's frame rate. Changes apply to active feeds.
	# Default: 10
	# Range: 1 ~ 60
	cameraMinimumRefreshRate = 10
	#Use Thruster Plume V2 Renderer with blue, orange/yellow, and burnt sienna exhaust
	useThrusterPlumeV2Renderer = true
	#Use Plume metaball rendering for the active V2 exhaust
	usePlumeMetaballRendering = true
	#Pixel resolution of the longest edge of ACC Display and CCTV tablet camera feeds. Aspect ratio is preserved. Higher values improve detail and use more GPU resources. Changes apply to active feeds.
	# Default: 320
	# Range: 64 ~ 2048
	cameraFeedResolution = 320
	#World Hologram Projector Resolution. FULL keeps original textured models. HIGH simplifies small projected blocks. MEDIUM always averages eligible solid faces; LOW also groups their colors, including nearby and layered terrain such as grass. Glass, thin blocks and block entity partials retain their models. Distant surfaces simplify further. Changes apply to active holograms.
	#Allowed Values: FULL, HIGH, MEDIUM, LOW
	worldHologramProjectorResolution = "FULL"

	#Seasonal visual effects
	[client.seasonal]
		#Default uses the current season; Off disables seasonal effects; the other values force a season
		#Allowed Values: DEFAULT, PRIDE, HALLOWEEN, CHRISTMAS, OFF
		forceSeasonalEffects = "DEFAULT"

		#Pride Month effects
		[client.seasonal.pride_month]
			#Solid cycles one color across the plume; Rainbow moves a gradient along it
			#Allowed Values: SOLID, RAINBOW
			thrusterPlumeEffect = "SOLID"
			#Color palette for Pride Month thruster exhaust
			#Allowed Values: DARKER, DEFAULT, PASTEL
			colorPalette = "DEFAULT"
