[fanParticles]
	# Default: 96
	# Range: 0 ~ 4096
	maxPerTick = 96
	# Default: 16
	# Range: 1 ~ 512
	nearDistance = 16
	# Default: 32
	# Range: 1 ~ 1024
	midDistance = 32
	# Default: 80
	# Range: 0 ~ 100
	nearPercent = 80
	# Default: 50
	# Range: 0 ~ 100
	midPercent = 50
	# Default: 25
	# Range: 0 ~ 100
	farPercent = 25

[shaderFlywheel]
	#Allow Colorwheel's instancing backend for shaderpacks without native Colorwheel support.
	#This restores Flywheel GPU instancing instead of rebuilding kinetic block vertices every frame.
	#Fallback mode can cause shaderpack-specific rendering issues; disable this option to use Colorwheel's own compatibility decision.
	forceColorwheelFallback = true

[blazeBurner]
	#Bulk-write static Blaze Burner templates in Iris' exact extended entity format.
	#Unsupported formats, transforms, consumers, and scrolling flame UVs use Create's original renderer.
	extendedVertexCache = true
	#Cache whether a basin or fluid tank is above a Blaze Burner and invalidate it on block changes.
	cacheBlockAbove = true
	#Keep ambient particles within 16 blocks, emit one quarter from 16 to 32 blocks, and omit them farther away.
	particleLod = true
	#Render Blaze Burners in Iris shader shadow passes.
	#Disabled by default because the measured shadow pass repeated the complete block-entity renderer.
	renderShaderShadows = false

[frogport]
	#Bulk-write stock Frogport body, head, and tongue models in Iris' exact extended terrain format.
	#Unsupported formats, overlays, and transforms use Create's original renderer.
	extendedVertexWriter = true
	#Upload stock Frogport body and head meshes once and retain rigid per-instance transforms.
	#Requires Sodium, Iris, an active shaderpack, and Flywheel's backend to be off.
	persistentVbo = true
	#Draw compatible Frogport VBO buckets with the Iris rigid-instance shader variant.
	#Unsupported shader stages or hardware fall back to exact persistent VBO draws.
	instancedDraw = true
	#FULL keeps all Frogport shadow geometry.
	#FAR_SIMPLIFIED keeps only the stock body beyond shadowSimplifiedDistance.
	#DISABLED omits the dynamic block-entity shadow; the chunk-baked base still casts a shadow.
	#Allowed Values: FULL, FAR_SIMPLIFIED, DISABLED
	shadowMode = "FULL"
	#Distance where FAR_SIMPLIFIED switches to the body-only Frogport shadow.
	# Default: 32
	# Range: 0 ~ 256
	shadowSimplifiedDistance = 32
	#Maximum GPU memory retained by Frogport body and head VBO light variants.
	# Default: 16
	# Range: 4 ~ 128
	vboCacheMiB = 16

[waterWheelVbo]
	#Cache static shader-compatible water wheel geometry in persistent GPU vertex buffers.
	#Wheel rotation remains exact and is applied per rendered instance.
	#Requires Sodium, Iris, an active shaderpack, and Flywheel's backend to be off; CreateBetterFPS is optional.
	enabled = true
	#Render water wheels in shader shadow passes.
	#Disabled by default because the shadow pass was the largest measured water-wheel render cost.
	renderShadows = false
	#Maximum GPU memory used by cached water wheel vertex buffers.
	# Default: 96
	# Range: 16 ~ 512
	maxCacheMiB = 96
	#Soft time budget for building and uploading new water wheel VBOs per rendered frame.
	#Additional uploads are deferred after the measured work reaches this budget.
	# Default: 4.0
	# Range: 0.25 ~ 16.0
	maxUploadMillisPerFrame = 4.0

[kineticMachineVbo]
	#Enable persistent VBO rendering for mixers, mechanical presses, mechanical crafters, millstones, Mechanical Arms, and stock small/large cogwheels.
	#Compatible cogwheels share rigid-instance draws in both main and shadow passes, including the large cog's independently rotated shaft.
	#Animation remains exact through per-instance matrices; dynamic crafter items and scrolling UVs stay on Create's original path.
	enabled = true
	#Render mixers, mechanical presses, mechanical crafters, and millstone inner cogs in shader shadow passes.
	#Disabled by default to omit the complete block-entity renderer for these machines from shader shadows.
	#Mechanical Arm cogs, rigid parts, and stock small/large cogwheels always retain their shader shadows.
	#The renamed key intentionally applies this safer default to configurations created by older releases.
	renderShaderShadows = false

[mechanicalPump]
	#Cache the stock Mechanical Pump cog in the shared persistent Iris VBO path.
	#Cog rotation remains exact and compatible pumps share rigid-instance draw calls.
	#Requires Sodium, Iris, an active shaderpack, and Flywheel's backend to be off.
	persistentVboEnabled = true
	#Render the moving Mechanical Pump cog in Iris shader shadow passes.
	#The chunk-baked pump body still casts its normal shadow when this is disabled.
	renderShaderShadows = false
	#Skip the stock pump fluid behaviour on the logical client while synchronized flow state is idle.
	#Active-flow state is refreshed when block-entity data is read, never by scanning connections every tick.
	skipIdleClientFluidTick = true

[millstone]
	#Use stable distance LOD for the millstone inner cog when shaders disable Flywheel.
	#Nearby millstones remain complete; omitted distant cogs retain the chunk-baked outer shell.
	mainLodEnabled = true
	# Default: 32
	# Range: 1 ~ 512
	midDistance = 32
	# Default: 64
	# Range: 1 ~ 1024
	farDistance = 64
	#Stable percentage of inner cogs retained from the mid-distance boundary.
	# Default: 50
	# Range: 0 ~ 100
	midPercent = 50
	#Stable percentage of inner cogs retained from the far-distance boundary.
	# Default: 25
	# Range: 0 ~ 100
	farPercent = 25

[shaft]
	#Cache static shaft geometry in the shared persistent Iris VBO path.
	#Rotation remains exact through a per-instance matrix; dynamic colors and unsupported formats use Create's original renderer.
	#Requires Sodium, Iris, an active shaderpack, and Flywheel's backend to be off.
	persistentVboEnabled = true
	#Draw compatible shaft VBO buckets with an internal Iris shader variant and instance matrices.
	#Unsupported shader stages, transforms, hardware, or compilation failures fall back to the existing exact per-shaft VBO path.
	instancedDrawEnabled = true
	#Render shafts and encased shafts in shader shadow passes.
	#Disabled by default because their shadow-map footprint is negligible while fallback rendering is expensive.
	renderShaderShadows = false
	#Client tick interval for shaft ambient-sound contributions.
	#Create accumulates ambient sources over five ticks, so the default keeps every shaft represented while staggering their work.
	# Default: 4
	# Range: 1 ~ 5
	audioIntervalTicks = 4

[crushingWheelParticles]
	#Maximum crushing-wheel particles per client tick. Active item crushing emits groups of four.
	# Default: 96
	# Range: 0 ~ 4096
	maxPerTick = 96
	# Default: 16
	# Range: 1 ~ 512
	nearDistance = 16
	# Default: 32
	# Range: 1 ~ 1024
	midDistance = 32
	# Default: 100
	# Range: 0 ~ 100
	nearPercent = 100
	# Default: 50
	# Range: 0 ~ 100
	midPercent = 50
	# Default: 25
	# Range: 0 ~ 100
	farPercent = 25

[chuteParticles]
	# Default: 16
	# Range: 0 ~ 4096
	maxPerTick = 16

[linkedOutlines]
	# Default: 4
	# Range: 1 ~ 20
	rebuildIntervalTicks = 4
	# Default: 16
	# Range: 1 ~ 128
	prewarmBoxesPerFrame = 16
	# Default: 2048
	# Range: 64 ~ 16384
	maxCachedBoxes = 2048

[factoryPanelFilterItems]
	#Render factory-panel filter item icons in shader shadow passes.
	#Disabled by default because the icons dominate factory-panel shadow rendering while contributing negligible shadows.
	renderInShaderShadows = false
	#Use stable distance LOD for factory-panel filter item icons in the main pass.
	#Nearby panels remain exact; distant panels are spatially sampled without temporal flicker.
	mainLodEnabled = true
	# Default: 24
	# Range: 1 ~ 512
	midDistance = 24
	# Default: 48
	# Range: 1 ~ 1024
	farDistance = 48
	# Default: 50
	# Range: 0 ~ 100
	midPercent = 50
	# Default: 20
	# Range: 0 ~ 100
	farPercent = 20

[belt]
	#Enable stable per-item distance LOD for transported belt items.
	itemRenderLodEnabled = true
	#Distance where stable medium-density item sampling starts.
	# Default: 32
	# Range: 1 ~ 512
	itemRenderMidDistance = 32
	#Distance where stable sparse item sampling starts.
	# Default: 48
	# Range: 1 ~ 768
	itemRenderFarLodDistance = 48
	#Maximum distance for transported belt item models.
	# Default: 64
	# Range: 1 ~ 1024
	itemRenderFarDistance = 64
	#Use a cached single-quad far LOD for stable flat item models.
	#Foil, NBT-sensitive, 3D, custom, multi-pass, package, and Flerovium-rendered items always use their original renderer.
	itemFarStaticModelEnabled = true
	#Distance where eligible flat transported items switch to the cached static far model.
	# Default: 28
	# Range: 1 ~ 512
	itemFarStaticModelDistance = 28
	#Stable percentage of belt items retained in the medium LOD tier.
	# Default: 50
	# Range: 0 ~ 100
	itemRenderMidPercent = 50
	#Stable percentage of belt items retained in the sparse LOD tier.
	# Default: 20
	# Range: 0 ~ 100
	itemRenderFarPercent = 20
	#Maximum distance for Create's flat fake shadow below transported items.
	#Fake shadows are always omitted from Iris shader shadow passes.
	# Default: 24
	# Range: 0 ~ 512
	itemFakeShadowDistance = 24
	#Omit Create's flat transported-item shadow whenever a shaderpack is active.
	#The shader shadow map already supplies the corresponding visual cue.
	skipItemFakeShadowsWithShaders = true
	#Maximum distance for extra visual copies of large item stacks.
	#The transported stack itself is still rendered beyond this distance.
	# Default: 12
	# Range: 0 ~ 64
	itemStackCopiesDistance = 12
	#Maximum distance for transported item models in Iris shader shadow passes.
	#The shadow pass rejects the complete belt before item iteration and hard-caps this value at 12 blocks.
	#Set to 0 to omit transported item models from shader shadow maps.
	# Default: 12
	# Range: 0 ~ 256
	itemShaderShadowDistance = 12
	#Opt into lossy camera-distance culling and stable sampling of belt body shader shadows.
	#Disabled by default to preserve belt-to-belt shading and ground shadows within the shaderpack's shadow range.
	#Enabling this can let sunlight through stacked belts. Persistent VBOs and bulk vertex writes remain active either way.
	bodyShaderShadowCullingEnabled = false
	#Requested maximum distance for fallback-rendered belt body geometry in Iris shadow passes.
	#Only applies when bodyShaderShadowCullingEnabled is true; otherwise the shaderpack controls the shadow range.
	#The fallback uses one decision for the complete belt and caps this at 16 blocks; from 8 to 16 blocks it retains one stable belt in four.
	#This is ignored while Flywheel visualization is active. Set to 0 to omit fallback belt bodies from shadow maps.
	# Default: 16
	# Range: 0 ~ 256
	bodyShaderShadowDistance = 16
	#Cache fallback belt body templates in persistent GPU buffers for the MAIN shader pass.
	#Each visible belt then submits only its transform and scrolling UV offset.
	#Requires Iris and Sodium, is disabled when irisflw owns belt visualization, and safely falls back on unsupported formats.
	bodyMainPersistentVboEnabled = true
	#Maximum GPU memory used by persistent fallback belt body templates.
	# Default: 64
	# Range: 8 ~ 256
	bodyMainPersistentVboMaxCacheMiB = 64
	#Soft per-frame time budget for creating new persistent belt body VBOs.
	# Default: 2.0
	# Range: 0.25 ~ 8.0
	bodyMainPersistentVboMaxUploadMillisPerFrame = 2.0

[kineticAudio]
	# Default: 48
	# Range: 0 ~ 512
	maxDistance = 48
	# Default: 4
	# Range: 1 ~ 20
	farIntervalTicks = 4

[steamJetParticles]
	# Default: 96
	# Range: 0 ~ 4096
	maxPerTick = 96
	# Default: 16
	# Range: 1 ~ 512
	nearDistance = 16
	# Default: 32
	# Range: 1 ~ 1024
	midDistance = 32
	# Default: 80
	# Range: 0 ~ 100
	nearPercent = 80
	# Default: 50
	# Range: 0 ~ 100
	midPercent = 50
	# Default: 25
	# Range: 0 ~ 100
	farPercent = 25
	#Queue steam jet sounds only inside this distance. Set to 0 to disable sound culling.
	# Default: 96
	# Range: 0 ~ 1024
	soundDistance = 96

[chainConveyorRender]
	#Enable Chain Conveyor span culling, light caching, and far-distance geometry LOD.
	enabled = true
	#Keep the stock Chain Conveyor wheel geometry resident on the GPU and submit visible wheels as rigid instances.
	#Requires Sodium, Iris, and an active shaderpack; unsupported states use the direct writer fallback.
	persistentWheelVbo = true
	#Use compatible bulk vertex writers for Chain Conveyor spans and as the stock wheel VBO fallback.
	directVertexWriter = true
	#Render one double-sided face instead of two beyond Create's 48-block chain MIP distance.
	farSinglePlane = true
	#Skip a chain span when its complete bounds are behind the main camera plane.
	behindCameraCulling = true
	#Maximum camera-to-chain distance in blocks.
	# Default: 192
	# Range: 32 ~ 512
	maxRenderDistance = 192
	#Maximum distance for Chain Conveyor spans in shader shadow passes.
	#Set to 0 to omit their shadows; wheels and transported packages are unaffected.
	# Default: 0
	# Range: 0 ~ 256
	shadowRenderDistance = 0

[displayBoard]
	#Enable Display Board text, visibility, and shader-fallback rendering optimizations.
	enabled = true
	#Render Display Board text and internal cogwheels in shader shadow passes.
	#Disabled by default because the chunk-baked board body already provides its useful shadow silhouette.
	renderShaderShadows = false
	#Compile stable Display Board sections once per resource generation.
	#Active flap transitions remain dynamic and unsupported text falls back to the exact original character path.
	stableTextCache = true
	#Bulk-write stock fallback cogwheels in Iris' exact extended terrain format when the persistent VBO path is unavailable.
	#This is owned by this mod and does not require CreateBetterFPS, Colorwheel, or irisflw.
	#Unsupported consumers, transforms, colors, formats, and shader states use Create's original renderer.
	extendedVertexWriter = true
	#Skip a cogwheel only when its complete conservative bounds project behind the opaque front or rear shell of its complete Display Board.
	#Cogwheels that can be seen through side, top, bottom, or perimeter openings remain rendered.
	completePanelOcclusion = true
	#Upload the stock shaftless cogwheel mesh once and retain only rigid per-instance transforms each frame.
	#Requires Iris only while a shaderpack disables Flywheel; it does not require another optimization mod.
	persistentCogVbo = true
	#Draw compatible Display Board cogwheel buckets with this mod's Iris rigid-instance shader variant.
	#Unsupported shader stages or hardware fall back to exact persistent VBO draws.
	instancedCogDraw = true
	#Maximum GPU memory retained by Display Board cogwheel VBO light and material variants.
	# Default: 16
	# Range: 4 ~ 128
	cogVboCacheMiB = 16
	#Maximum distance from the camera to the nearest point of a Display Board's complete bounds.
	#Set to 0 to disable distance culling; full-board frustum culling remains enabled.
	# Default: 128
	# Range: 0 ~ 1024
	maxRenderDistance = 128
