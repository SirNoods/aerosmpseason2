[chute]
	#Ticks before retrying a chute lookup that returned no target/capability.
	# Default: 5
	# Range: 1 ~ 20
	negativeCacheTicks = 5

[fan]
	#Ticks between fallback checks for Copycat or external fan processors; smaller values do more work.
	#Set to 0 to disable periodic checks. Block, chunk and speed changes still invalidate immediately.
	#With checks disabled, addon changes that emit no update event may remain undetected.
	# Default: 20
	# Range: 0 ~ 200
	periodicFallbackIntervalTicks = 20

[fluidTank]
	#Maximum ticks to reuse a fluid tank controller reference.
	#Controller changes invalidate the cache immediately. Recommended: 10-40.
	# Default: 20
	# Range: 5 ~ 100
	controllerCacheLifetime = 20

[belt]
	#Replace FluidLogistics' 11x11x11 mechanical fluid gun scan with a per-Level target index.
	#Has no effect when FluidLogistics is not installed.
	#Re-enabling this option rebuilds the index from currently loaded chunks before using it.
	fluidGunTargetIndexEnabled = true
